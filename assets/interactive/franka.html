<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>QCP interactive tasks</title><link rel="stylesheet" href="franka.css?v=studio-88"><script type="module" src="franka.js?v=studio-87"></script></head><body>
